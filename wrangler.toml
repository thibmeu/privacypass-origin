main = "./dist/worker.mjs"
compatibility_date = "2022-04-12"
workers_dev = false # Enable it for development purposes, and if you are want a domain ending with .workers.dev
account_id = "022362f27de5264a50ce60cb23293c9f" # Log in dash.cloudflare.com, select an account, go to Workers, and copy Account ID

[build]
command = 'npm install && npm run build'

[env.production]
name = "pp-origin"
route = { pattern = "pp-origin.example.test", custom_domain=true }
# If you deploy an issuer yourself that uses Cloudflare Workers, you need to use Service Bindings for the attester to reach to this issuer
# This is the case for instance if you deploy cloudfare/pp-issuer with cloudflare/pp-attester
# services = [
#   { binding = "ISSUER", service = "pp-issuer-production", environment = "production" }
# ]

[env.production.vars]
ISSUER_URL = "https://pp-issuer-public.research.cloudflare.com" # Use Cloudflare Research Public Issuer. This is only meant for experiments, AND SHOULD NOT BE USED ON A PRODUCTION SERVICE
ORIGIN_NAME = "pp-origin.example.test"

# ACT Origin Environment
[env.act]
name = "act-origin"
route = { pattern = "act-origin.research.cloudflare.com", custom_domain = true }
services = [
  { binding = "ACT_ISSUER", service = "act-issuer", environment = "act" }
]

[env.act.vars]
ISSUER_URL = "https://act-issuer.research.cloudflare.com"
ORIGIN_NAME = "act-origin.research.cloudflare.com"
ACT_DOMAIN_SEPARATOR = "cloudflare:act-issuer:research:v1"
ACT_L = "8"
ACT_RETURN_CREDITS = "1"

# Local development
[env.dev]
name = "act-origin-dev"

[env.dev.vars]
ISSUER_URL = "http://localhost:8787"
ORIGIN_NAME = "localhost:8788"
ACT_DOMAIN_SEPARATOR = "cloudflare:act-issuer:dev:v1"
ACT_L = "8"
ACT_RETURN_CREDITS = "1"
